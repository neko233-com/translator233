name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The MyGo GUI needs a desktop session to run, but compiles everywhere.
      - name: Build
        run: go build ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross build
        run: |
          set -e
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "dist/translator233-$os-$arch$ext" ./cmd/translator233
          done
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
