name: ci

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Desktop targets only: Windows x64/arm64 and macOS Apple Silicon.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + headless GUI layout)
        run: go test ./... -timeout 10m
      # The MyGo GUI needs a desktop session to run, but compiles everywhere.
      - name: Build
        run: go build ./...

  # Real end-to-end run: builds the CLI, downloads ONNX Runtime and the
  # Chinese/English packs (~300MB), then translates, serves and drives the
  # daemon. Manual or tag only, because of the downloads.
  e2e:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: End-to-end
        env:
          TRANSLATOR233_E2E: "1"
        run: go test ./e2e -v -timeout 40m

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross build
        run: |
          set -e
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; ldflags="-s -w"
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "dist/translator233-$os-$arch$ext" ./cmd/translator233
            if [ "$os" = "windows" ]; then ldflags="-s -w -H=windowsgui"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "dist/translator233-gui-$os-$arch$ext" ./cmd/translator233-gui
          done
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

